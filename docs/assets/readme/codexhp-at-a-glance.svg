<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">CodexHp overlay at a glance</title>
  <desc id="description">A numbered diagram showing the session and weekly limit gauges, reset progress, token activity graph, and OpenAI service status stripe.</desc>
  <defs>
