name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, such as v0.2.0
        required: true
        type: string
      allow_unsigned:
        description: I acknowledge that this GitHub Release is not code-signed
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify explicit unsigned approval and project version
        shell: pwsh
        run: |
          if ($env:ALLOW_UNSIGNED -ne 'true') {
            throw 'Unsigned publication requires allow_unsigned=true.'
          }
          [xml]$project = Get-Content ./src/CodexHp.App/CodexHp.App.csproj -Raw
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag '$env:RELEASE_TAG' does not match project version '$version'."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: >-
          winget install --id JRSoftware.InnoSetup --exact --silent
          --accept-package-agreements --accept-source-agreements --disable-interactivity

      - name: Build and verify portable executable
        shell: pwsh
        run: ./scripts/Verify-Core.ps1

      - name: Build installer
        shell: pwsh
        run: ./scripts/Build-Installer.ps1 -UseExistingVerifiedPublish

      - name: Stage explicitly approved unsigned release assets
        shell: pwsh
        run: ./scripts/Stage-Release.ps1 -AllowUnsignedRelease

      - name: Publish unsigned GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          > [!WARNING]
          > This release is not code-signed. Windows SmartScreen or Smart App Control may warn about or block these files. Download them only from this GitHub Release and verify the SHA-256 checksums.

          CodexHp 0.2.0 introduces installer-first distribution for Windows 11.

          - `CodexHp-Setup-0.2.0-x64.exe` is the recommended per-user installer.
          - `CodexHp-Portable-0.2.0-x64.exe` is the secondary portable build.
          - `SHA256SUMS.txt` contains the SHA-256 digest for both executables.
          - This release is not submitted to WinGet.
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'codexhp-release-notes.md'
          $notes | Set-Content -LiteralPath $notesPath -Encoding utf8NoBOM
          $assets = @(Get-ChildItem ./out/release -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG $assets `
            --verify-tag `
            --latest `
            --title "CodexHp $env:RELEASE_TAG" `
            --notes-file $notesPath
