<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">CodexHp placement options</title>
  <desc id="description">Two monitor diagrams showing CodexHp embedded in the Windows taskbar and freely positioned on the desktop.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11141A" />
      <stop offset="1" stop-color="#222630" />
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303644" />
      <stop offset="1" stop-color="#1C2028" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1200" height="500" rx="28" fill="url(#page)" />

  <g filter="url(#shadow)">
    <rect x="70" y="70" width="500" height="340" rx="18" fill="url(#screen)" stroke="#48505F" stroke-width="3" />
    <rect x="70" y="358" width="500" height="52" rx="0 0 16 16" fill="#17191E" />
    <rect x="90" y="368" width="220" height="32" rx="4" fill="#18181C" />
    <rect x="96" y="373" width="70" height="10" rx="2" fill="#3A8EFF" />
    <rect x="96" y="387" width="48" height="8" rx="2" fill="#DC4856" />
    <line x1="178" y1="394" x2="300" y2="394" stroke="#FFFFFF" stroke-width="1.5" />
    <g fill="#2667CD">
      <rect x="186" y="385" width="3" height="9" />
      <rect x="202" y="379" width="3" height="15" />
      <rect x="234" y="388" width="3" height="6" />
      <rect x="266" y="375" width="3" height="19" />
      <rect x="290" y="383" width="3" height="11" />
    </g>
    <g fill="#8D95A3">
      <circle cx="452" cy="384" r="8" />
      <circle cx="480" cy="384" r="8" />
      <circle cx="508" cy="384" r="8" />
    </g>

    <rect x="630" y="70" width="500" height="340" rx="18" fill="url(#screen)" stroke="#48505F" stroke-width="3" />
    <rect x="630" y="358" width="500" height="52" rx="0 0 16 16" fill="#17191E" />
    <g fill="#8D95A3">
      <circle cx="872" cy="384" r="8" />
      <circle cx="900" cy="384" r="8" />
      <circle cx="928" cy="384" r="8" />
    </g>
    <rect x="810" y="210" width="260" height="72" rx="7" fill="#18181C" stroke="#FFFFFF" stroke-width="2" />
    <rect x="821" y="220" width="88" height="19" rx="3" fill="#3A8EFF" />
    <rect x="821" y="247" width="55" height="18" rx="3" fill="#DC4856" />
    <line x1="930" y1="266" x2="1055" y2="266" stroke="#FFFFFF" stroke-width="2" />
    <g fill="#2667CD">
      <rect x="938" y="254" width="4" height="12" />
      <rect x="958" y="240" width="4" height="26" />
      <rect x="978" y="258" width="4" height="8" />
      <rect x="1018" y="226" width="4" height="40" />
      <rect x="1038" y="247" width="4" height="19" />
    </g>
    <g fill="none" stroke="#B9C0CC" stroke-width="3" stroke-linecap="round">
      <path d="M790 246 H750" /><path d="M758 238 L750 246 L758 254" />
      <path d="M1090 246 H1110" /><path d="M1102 238 L1110 246 L1102 254" />
      <path d="M940 190 V162" /><path d="M932 170 L940 162 L948 170" />
      <path d="M940 302 V330" /><path d="M932 322 L940 330 L948 322" />
    </g>
  </g>

  <g font-family="Segoe UI, sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <circle cx="320" cy="444" r="28" fill="#3A8EFF" /><text x="320" y="455" fill="#FFFFFF">1</text>
    <circle cx="880" cy="444" r="28" fill="#9B66E5" /><text x="880" y="455" fill="#FFFFFF">2</text>
  </g>
</svg>
