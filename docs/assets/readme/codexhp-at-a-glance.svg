<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">CodexHp overlay at a glance</title>
  <desc id="description">A numbered diagram showing the session and weekly limit gauges, reset progress, token activity graph, and OpenAI service status stripe.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101319" />
      <stop offset="1" stop-color="#20232B" />
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F7DE1" />
      <stop offset="1" stop-color="#54A0FF" />
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C93F4E" />
      <stop offset="1" stop-color="#F15B68" />
    </linearGradient>
    <linearGradient id="token" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2667CD" />
      <stop offset="1" stop-color="#DC4856" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#background)" />
  <circle cx="1030" cy="70" r="150" fill="#3A8EFF" opacity="0.06" />
  <circle cx="130" cy="480" r="190" fill="#DC4856" opacity="0.05" />

  <g filter="url(#shadow)">
    <rect x="120" y="150" width="960" height="220" rx="16" fill="#18181C" stroke="#343741" stroke-width="3" />

    <rect x="142" y="172" width="8" height="176" rx="4" fill="#F5A623" />

    <rect x="170" y="172" width="270" height="66" rx="5" fill="#3E3E44" />
    <rect x="170" y="172" width="211" height="66" rx="5" fill="url(#blue)" />
    <text x="305" y="216" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="38" font-weight="700" text-anchor="middle">78%</text>
    <rect x="170" y="247" width="270" height="10" rx="5" fill="#44464E" />
    <rect x="170" y="247" width="189" height="10" rx="5" fill="#FFFFFF" />

    <rect x="170" y="271" width="270" height="66" rx="5" fill="#3E3E44" />
    <rect x="170" y="271" width="113" height="66" rx="5" fill="url(#red)" />
    <text x="305" y="315" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="38" font-weight="700" text-anchor="middle">42%</text>
    <rect x="170" y="346" width="270" height="10" rx="5" fill="#44464E" />
    <rect x="170" y="346" width="76" height="10" rx="5" fill="#FFFFFF" />

    <line x1="490" y1="334" x2="1040" y2="334" stroke="#FFFFFF" stroke-width="3" />
    <g stroke="#808080" stroke-width="2" stroke-dasharray="4 10" opacity="0.8">
      <line x1="628" y1="174" x2="628" y2="334" />
      <line x1="766" y1="174" x2="766" y2="334" />
      <line x1="904" y1="174" x2="904" y2="334" />
    </g>
    <g fill="url(#token)">
      <rect x="520" y="320" width="12" height="14" rx="2" />
      <rect x="548" y="309" width="12" height="25" rx="2" />
      <rect x="576" y="324" width="12" height="10" rx="2" />
      <rect x="646" y="276" width="12" height="58" rx="2" />
      <rect x="674" y="314" width="12" height="20" rx="2" />
      <rect x="716" y="292" width="12" height="42" rx="2" />
      <rect x="786" y="318" width="12" height="16" rx="2" />
      <rect x="828" y="251" width="12" height="83" rx="2" />
      <rect x="856" y="306" width="12" height="28" rx="2" />
      <rect x="926" y="192" width="12" height="142" rx="2" />
      <rect x="954" y="278" width="12" height="56" rx="2" />
      <rect x="982" y="310" width="12" height="24" rx="2" />
      <rect x="1010" y="229" width="12" height="105" rx="2" />
    </g>
  </g>

  <g fill="none" stroke="#9DA5B4" stroke-width="3">
    <path d="M280 106 L280 150" />
    <path d="M382 418 L382 356" />
    <path d="M820 106 L820 172" />
    <path d="M78 260 L142 260" />
  </g>

  <g font-family="Segoe UI, sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <circle cx="280" cy="75" r="30" fill="#3A8EFF" /><text x="280" y="86" fill="#FFFFFF">1</text>
    <circle cx="382" cy="449" r="30" fill="#F4F6FA" /><text x="382" y="460" fill="#17191E">2</text>
    <circle cx="820" cy="75" r="30" fill="#9B66E5" /><text x="820" y="86" fill="#FFFFFF">3</text>
    <circle cx="47" cy="260" r="30" fill="#F5A623" /><text x="47" y="271" fill="#17191E">4</text>
  </g>
</svg>
